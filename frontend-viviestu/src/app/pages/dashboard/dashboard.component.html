<nav class="navbar">
  <div class="nav-left">
    <h1 class="logo-text" routerLink="/" style="cursor: pointer;">ViviEstu</h1>

    <nav class="nav-links">
      <a routerLink="/">Inicio</a>
      <a routerLink="/dashboard">Más</a>
      <a routerLink="/nosotros">Nosotros</a>
    </nav>
  </div>

  <div class="nav-right" *ngIf="usuarioService.isLoggedIn(); else invitadoDash">
    
    <div class="user-menu" (click)="toggleUserMenu($event)">
      Hola, <b>{{ usuarioService.userName() }}</b> <span class="chevron">▾</span>
    </div>

    <div class="user-dropdown" *ngIf="showUserMenu">
      <button (click)="irAlPerfil()">Actualizar perfil</button>
      <button (click)="irADesactivarCuenta()">Desactivar cuenta</button>
      <hr>
      <button (click)="logout()">Cerrar sesión</button>
    </div>

  </div>

  <ng-template #invitadoDash>
    <div class="nav-right">
      <button class="btn-login" routerLink="/login">Iniciar sesión</button>
    </div>
  </ng-template>
</nav>


<div class="dashboard-container">
  <h1>Panel de Control</h1>
  <p>¿Qué deseas hacer hoy?</p>

  <div class="grid-actions">
    <div class="action-card" routerLink="/zonas">
      <div class="icon">🏙️</div>
      <h3>Explorar Zonas</h3>
      <p>Busca alojamiento cerca de tu universidad.</p>
    </div>

    <div class="action-card" routerLink="/profile">
      <div class="icon">👤</div>
      <h3>Mi Perfil</h3>
      <p>Gestiona tus preferencias y cuenta.</p>
    </div>

    <div class="action-card disabled">
      <div class="icon">⭐</div>
      <h3>Mis Favoritos</h3>
      <p>Próximamente...</p>
    </div>
  </div>
</div>
