<div class="register-page">
  
  <nav class="navbar">
    <div class="logo">ViviEstu</div>
    <div class="nav-links">
      <a routerLink="/">Inicio</a>
      <a href="#">Nosotros</a>
      <a href="#">Más</a>
    </div>
    <div class="nav-actions">
      <a routerLink="/login" class="btn-outline">Iniciar Sesión</a>
    </div>
  </nav>

  <div class="register-container">
    <div class="register-card">
      
      <h2 class="bienvenido">Bienvenido a ViviEstu</h2>
      <p class="subtitulo">REGISTRARSE</p>

      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onRegister()">
        
        <div class="input-field">
          <label>Nombre completo*</label>
          <input type="text" name="nombre" [(ngModel)]="registroData.nombre" placeholder="Ej: Alexandra" required>
        </div>

        <div class="input-field">
          <label>Correo electrónico*</label>
          <input type="email" name="correo" [(ngModel)]="registroData.correo" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="input-field">
          <label>Usuario (Nick)*</label>
          <input type="text" name="usuario" [(ngModel)]="registroData.nombreUsuario" placeholder="User123" required>
        </div>

        <div class="input-field">
          <label>Fecha de nacimiento*</label>
          <input type="date" name="fecha" [(ngModel)]="registroData.fechaNacimiento" required>
        </div>

        <div class="input-field">
          <label>Contraseña*</label>
          <input type="password" name="pass" [(ngModel)]="registroData.contrasena" placeholder="*******" required>
        </div>

        <div class="input-field">
          <label>Repetir contraseña*</label>
          <input type="password" name="confirmPass" [(ngModel)]="repetirContrasena" placeholder="*******" required>
        </div>

        <button type="submit" class="btn-register" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Registrando...' : 'REGISTRARSE' }}
        </button>

      </form> </div> </div> <div class="modal-overlay" *ngIf="showSuccessModal">
    <div class="modal-box">
      <div class="icon-check">✓</div>
      
      <h3>¡Registro Exitoso!</h3>
      <p>Tu cuenta ha sido creada correctamente.</p>
      <p>Ahora puedes ingresar con tus credenciales.</p>
      
      <button class="btn-modal" (click)="irALogin()">
        Ir a Iniciar Sesión
      </button>
    </div>
  </div>

</div>
