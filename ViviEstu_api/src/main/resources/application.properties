spring.application.name=ViviEstu_api

# Datasource configuration
# Prefer setting the following environment variables for production (PostgreSQL):
#   SPRING_DATASOURCE_URL (e.g. jdbc:postgresql://host:5432/dbname)
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_DATASOURCE_DRIVER (optional, e.g. org.postgresql.Driver)
#
# For local development, if the environment variables are not provided we fall back to
# a local H2 file database so data persists between runs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/viviestu;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Default driver is H2; when you provide SPRING_DATASOURCE_URL for Postgres also set
# SPRING_DATASOURCE_DRIVER=org.postgresql.Driver (or set it below).
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Example environment variable settings (PowerShell):
# $env:SPRING_DATASOURCE_URL = 'jdbc:postgresql://localhost:5432/viviestu'
# $env:SPRING_DATASOURCE_USERNAME = 'viviestu_user'
# $env:SPRING_DATASOURCE_PASSWORD = 'secret'
# $env:SPRING_DATASOURCE_DRIVER = 'org.postgresql.Driver'

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# If you connect to PostgreSQL you can enable an explicit dialect. For H2 this is
# usually not required because Hibernate will detect the dialect automatically.
# Uncomment to force PostgreSQL dialect when using Postgres:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port
server.port=8080
